[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "rule-of-thumb"
version = "0.1.0"

authors = [ { name = "David Wright", email = "dcw3.dev@gmail.com" } ]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "jupyterlab>=4.5,<5",
  "jupyterlab-vim>=4.1.4,<5",
  "matplotlib>=3.10.7,<4",
  "python-lsp-server>=1.14,<2",
  "quadax>=0.2,<0.3",
  "scipy>=1.13.3,<2",
  "tqdm>=4.67.1,<5",
]

[tool.pixi.workspace]
channels = [ "conda-forge" ]
platforms = [ "linux-64" ]

[tool.pixi.pypi-dependencies]
jax = { version = ">=0.4.31" }
ptarcade = { git = "git+https://github.com/davecwright3/PTArcade.git", branch = "feat/jax-utilities" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "==3.11"
